services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sqoch-backend
    ports:
      - "8000:8000"
    environment:
      - TOTAL_CAPACITY=100
      - ADULT_PRICE=1500
      - CHILD_PRICE=750
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: sqoch-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped